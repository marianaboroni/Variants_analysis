# tumoronly — minimal, documented example configuration.
# Only the OncoKB section is optional; the core pipeline does not require it.

analysis:
  run_id: example_run          # optional; derived from the input checksum if omitted
  output_dir: results          # run outputs go to results/<run_id>/
  threads: 4

input:
  path: data/demo/variants.tsv # VCF/MAF/TSV (.vcf[.gz]/.maf[.gz]/.tsv[.gz]/.txt[.gz])
  # Cohort of several single-sample files (e.g. one Mutect2 tumor-only VCF per
  # sample): give a YAML list instead of a scalar. Each file is ingested on its
  # own (own format/sample detection), then combined into one cohort-wide table
  # for this run — no `bcftools merge` needed. This is what makes
  # cohort.recurrent_variant_fraction_artifact meaningful; see
  # docs/FILTERING_STRATEGY.md, "Cohort-wide ingestion".
  #   path:
  #     - mutect2/sample1/sample1.mutect2.filtered_VEP.ann.vcf.gz
  #     - mutect2/sample2/sample2.mutect2.filtered_VEP.ann.vcf.gz
  format: auto                 # auto | vcf | maf | tsv (detected by content, not extension alone)
  genome_build: GRCh38         # prevails over the VCF header; conflict => error
  sample_metadata: data/demo/sample_metadata.tsv
  chunk_size: null             # e.g. 100000 to read large VCFs in bounded-memory blocks
  # column_map:                # only for custom TSVs where aliases don't match
  #   chrom: CHROMOSOME
  #   pos: START
  #   ref: REF_ALLELE
  #   alt: ALT_ALLELE
  #   sample_id: SAMPLE

reference:
  fasta: null                  # target-build FASTA, enables COSMIC REF validation
  chain_file: null             # UCSC chain, only needed for cross-build COSMIC

cosmic:
  # Point to an already-prepared processed DB, OR give raw_file to build one.
  processed_db: null           # e.g. db/cosmic/v99/GRCh38_to_GRCh38
  raw_file: null               # e.g. data/COSMIC_updated.tsv.gz — OR run `tumoronly build-cosmic-input`
                                # first (see below) and point this at its output.
  release: v99
  source_build: GRCh38
  target_build: GRCh38
  cache_dir: db/cosmic
  rebuild: false
  # Only read by `tumoronly build-cosmic-input` (a one-time, separate step that
  # produces `raw_file` above from the raw COSMIC release files — see
  # docs/AUXILIARY_DATABASES.md). Not read by `prepare-cosmic`/`run`.
  input_sources:
    genome_screens_tsv: null        # Cosmic_GenomeScreensMutant_v104_GRCh38.tsv
    noncoding_tsv: null             # Cosmic_NonCodingVariants_v104_GRCh38.tsv
    genome_screens_normal_vcf: null # Cosmic_GenomeScreensMutant_Normal_v104_GRCh38.vcf
    noncoding_normal_vcf: null      # Cosmic_NonCodingVariants_Normal_v104_GRCh38.vcf
    classification_tsv: null        # Cosmic_Classification_v104_GRCh38.tsv.gz
  # tumor-type-stratified COSMIC evidence (see docs/COSMIC_DECISION_RULES.md)
  tumor_type_mapping: config/cosmic_tumor_type_mapping.tsv
  pan_cancer_min_tumor_types: 5
  # OS4/OM4 are granted ONLY from tumor-context occurrences (heuristic thresholds;
  # see docs/COSMIC_OS4_OM4_AUDIT.md). Global-only recurrence never grants them.
  os4_min_matched_occurrences: 10
  om4_min_matched_occurrences: 3

# --- scientific thresholds (unchanged from the original pipeline) ------------
cohort:
  cancer_type: "PANCANCER"
  recurrent_variant_fraction_artifact: 0.30
  recurrent_locus_fraction_artifact: 0.40
  # Below this many distinct samples in the run, recurrence evidence is not
  # evaluated at all (NA, not FALSE) - a fraction is meaningless at N=2, where
  # 1/2 samples sharing a variant is already 50%. See
  # docs/FILTERING_STRATEGY.md, "Cohort-size-adaptive recurrence".
  min_cohort_size_for_recurrence: 10
  # Absolute floor on how many samples must actually carry a variant/locus
  # before its cohort fraction counts as artifact evidence, in addition to
  # the fraction thresholds above.
  min_recurrent_samples: 3
  min_recurrent_locus_samples: 3

cancer:
  default_tumor_type: "PANCANCER"

hard_filters:
  enabled: true
  assay: "WGS"
  adaptive_depth_fraction: 0.35
  adaptive_q25_depth_fraction: 0.50
  missing_required_metrics_fail: false
  # Caller FILTER values that pass the technical gate (default: PASS only).
  # For a Mutect2 tumor-only cohort where PASS/germline/panel_of_normals/
  # combinations were all retained upstream (see docs/FILTERING_STRATEGY.md,
  # "Caller FILTER as graded evidence"), uncomment to let germline/PON-flagged
  # variants reach population/oncogenic scoring instead of an automatic
  # technical_fail:
  # caller_filter_accepted_values: ["PASS", "germline", "panel_of_normals", "germline;panel_of_normals"]
  # FILTER values treated as the caller's own germline signal (feeds
  # caller_germline_flag -> germline_score; never a veto on its own):
  # caller_filter_germline_values: ["germline", "germline;panel_of_normals"]

# --- adaptive per-sample filtering (EXPERIMENTAL; see docs/ADAPTIVE_FILTERING.md)
adaptive_filtering:
  enabled: true
  escalate_to_review: true          # borderline-technical PASS -> REVIEW (documented)
  hard_safety_limits:               # absolute floors; adaptive never goes below these
    minimum_dp: 8
    minimum_alt_depth: 2
  depth:
    method: percentile_mad          # percentile | robust_zscore | percentile_mad
    percentile: 0.05
    mad_multiplier: 3
    absolute_floor: 8
  alt_depth:
    absolute_floor: 2
    minimum_signal_to_noise: 3
  vaf:
    minimum_above_noise_factor: 3
  sample_qc:
    min_callable_fraction: 0.5
  decision:
    review_margin: 0.15

technical_filters:
  min_depth: 20
  min_alt_count_snv: 5
  min_alt_count_indel: 8
  min_af_snv: 0.03
  min_af_indel: 0.05
  min_tlod: 6
  min_mbq: 25
  min_mmq: 40

population_filters:
  common_af_threshold: 0.01
  low_frequency_af_threshold: 0.001
  use_population_columns:
    - gnomADg_AF

scoring:
  high_confidence_somatic: 0.75
  probable_somatic: 0.55
  probable_germline: 0.70
  probable_artifact: 0.70

guideline_classification:
  enabled: true
  somatic:
    benign_maf_very_strong: 0.05
    benign_maf_strong: 0.01
    absent_population_af: 0.00001
    cosmic_moderate_count: 3
    cosmic_high_count: 10
  germline:
    ba1_af: 0.05
    bs1_af: 0.01
    pm2_af: 0.00001

driver_resources:
  driver_genes: data/demo/driver_genes.tsv
  hotspots: data/demo/hotspots.tsv

driver_scoring:
  known_driver: 0.75
  probable_driver: 0.60
  possible_driver: 0.40

# --- OncoKB (optional, post-hoc, never affects filtering) --------------------
oncokb:
  enabled: false
  scope: retained              # retained | all
  cache_dir: db/oncokb_cache
  endpoint: "https://www.oncokb.org/api/v1"
  # token comes ONLY from the ONCOKB_TOKEN environment variable

# --- functional predictors (never filter; prioritization only) ---------------
predictors:
  detect_automatically: true
  use_for_prioritization: true
  use_for_filtering: false
  mode: consensus
  minimum_applicable_predictors: 2
  minimum_damaging_predictors: 2     # families, not raw predictors
  missing_policy: ignore
  conflict_policy: report

# --- overall artifact-vs-true authenticity assessment (annotation, heuristic) -
authenticity:
  likely_true_min: 0.66
  likely_artifact_max: 0.40

# --- Brazilian-aware population evidence (see docs/POPULATION_BRAZIL.md) -------
population:
  global:
    common_af: 0.01
    rare_af: 0.001
  brazilian:
    db: null                      # VCF-standard, prepared TSV — output of `tumoronly prepare-abraom`
    raw_file: null                 # only read by `prepare-abraom`: raw ANNOVAR-format TSV (e.g.
                                    # SABE1171.Abraom.clean.tsv) — user-provided, not redistributed
    cache_dir: db/abraom           # only read by `prepare-abraom`
    name: ABraOM_SABE
    genome_build: GRCh38          # ABraOM SABE-WGS is GRCh38; SABE-WES is GRCh37
    common_af: 0.01
    review_af: 0.001
    minimum_allele_count: 2
    cohort_size: 1171
    escalate_to_review: true      # documented rule: possible Brazilian germline -> REVIEW
  local_controls:
    path: null
    artifact_or_germline_af: 0.005
    minimum_observations: 2

# --- genetic-ancestry inference (EXPERIMENTAL; research, non-diagnostic) -------
ancestry:
  enabled: false
  marker_panel:
    path: null                    # AIMs panel TSV (canonical_key + AFR/EUR/NAT/EAS/SAS freq)
    version: aims_v1
    genome_build: GRCh38
  qc:
    minimum_depth: 10
    minimum_alt_reads: 3
    minimum_snps: 100
  dominant_component_threshold: 0.80
  admixed_minimum_secondary_component: 0.15

# --- native maftools plots ----------------------------------------------------
plots:
  minimum_samples_for_oncoplot: 2
  minimum_samples_for_interactions: 20
  minimum_mutations_for_rainfall: 50
  minimum_protein_changes_for_lollipop: 3
  oncoplot:
    top: 20
    sort_by_annotation: true
    remove_non_mutated: false
    clinical_features:
      - tumor_type
      - tumor_subtype
      - histology

report:
  format: html
  oncoplot:
    top_genes: 20
    remove_non_mutated: false
