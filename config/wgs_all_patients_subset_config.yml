input:
  variants: "data/test/WGS_all_patients_first100k.tsv"
  genome_build: GRCh38
  delimiter: "\t"
  sample_qc: null
  sample_metadata: null
  metadata_delimiter: "\t"

output:
  dir: "results/wgs_all_patients_subset_filter"

dashboard:
  enabled: true
  file: "variant_filtering_dashboard.html"

cohort:
  cancer_type: "UCEC"
  min_samples_for_recurrence_model: 20
  recurrent_variant_fraction_artifact: 0.05
  recurrent_locus_fraction_artifact: 0.08
  batch_column: null

cancer:
  default_tumor_type: "UCEC"

hard_filters:
  enabled: true
  assay: "WGS"
  adaptive_depth_fraction: 0.35
  adaptive_q25_depth_fraction: 0.50
  missing_required_metrics_fail: false

technical_filters:
  min_depth: 20
  min_alt_count_snv: 5
  min_alt_count_indel: 8
  min_af_snv: 0.03
  min_af_indel: 0.05
  min_tlod: 6
  min_mbq: 25
  min_mmq: 40

population_filters:
  common_af: 0.005
  rare_af: 0.001
  use_population_columns:
    - GMAF
    - gnomADe_AF
    - ABraOM_AF
    - AbraOM_AF
    - ABraOM_MAF
    - BIPMed_AF

scoring:
  high_confidence_somatic: 0.75
  probable_somatic: 0.55
  probable_germline: 0.70
  probable_artifact: 0.70
  validation_rescue_somatic_min: 0.45

validation:
  oncokb: null
  cosmic: null

driver_resources:
  driver_genes: null
  driver_genes_delimiter: "\t"
  hotspots: null
  hotspots_delimiter: "\t"

driver_scoring:
  known_driver: 0.75
  probable_driver: 0.60
  possible_driver: 0.40
  min_tumor_type_samples_for_recurrence_driver: 5

guideline_classification:
  enabled: true
  somatic:
    benign_maf_very_strong: 0.05
    benign_maf_strong: 0.01
    absent_population_af: 0.00001
    cosmic_moderate_count: 3
    cosmic_high_count: 10
  germline:
    ba1_af: 0.05
    bs1_af: 0.01
    pm2_af: 0.00001

ml_filter:
  enabled: true
  review_labels: null
  review_labels_delimiter: "\t"
  manual_label_weight: 5
  pseudo_label_weight: 1
  tumor_type_models: true
  seed: 20260621
  max_training_rows: 200000
  min_positive_labels: 50
  min_negative_labels: 50
  per_tumor_min_positive_labels: 25
  per_tumor_min_negative_labels: 25
  true_positive_cutoff: 0.60

active_learning:
  enabled: true
  max_candidates: 500
  include_reviewed: false
  uncertainty_score_min: 0.70
  recurrent_variant_fraction: 0.05
  min_samples_for_recurrence: 20

tmb:
  callable_mb: 30
  use_ml_filter: false
  ml_true_positive_cutoff: 0.60
  intermediate_threshold: 5
  high_threshold: 10

clonality:
  enabled: true
  default_total_cn: 2
  default_multiplicity: 1
  normal_cn: 2
  clonal_ccf_cutoff: 0.85
  subclonal_ccf_cutoff: 0.55
  clonal_vaf_proxy_cutoff: 0.30
  subclonal_vaf_proxy_cutoff: 0.12
  min_variants_for_clustering: 10
  max_clusters_per_sample: 3
  seed: 20260621

ancestry:
  enabled: true
  reference_genotypes: null
  reference_delimiter: "\t"
  require_population_af: true
  min_population_af: 0.01
  max_population_af: 0.99
  min_depth: 10
  min_alt_count: 3
  het_vaf_min: 0.25
  hom_alt_vaf_min: 0.80
  include_final_classes:
    - likely_germline
    - manual_review_required
    - uncertain_tumor_only
  min_snps: 200
  min_snps_per_sample: 100
  min_snp_call_rate: 0.20
  min_maf: 0.01
  max_sample_missing_rate: 0.95
  max_candidate_snps: 200000
  max_snps_for_pca: 50000
  ld_prune: true
  ld_r2_threshold: 0.20
  ld_window_bp: 500000
  missing_genotype_imputation: "mean"
  n_pcs: 10
  assignment_pcs: 5
  min_reference_overlap_snps: 200

visualization:
  enabled: true
  dir: "results/wgs_all_patients_subset_filter/figures"
  include_final_classes:
    - high_confidence_somatic
    - probable_somatic
  use_ml_filter: false
  ml_true_positive_cutoff: 0.60
  oncoplot_top_genes: 20
  max_plot_points: 200000
  seed: 20260621
