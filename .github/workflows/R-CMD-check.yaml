name: R CMD check

on:
  push:
    branches: [main, master, "feature/**", "codex/**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::testthat
            any::ggplot2
            any::rmarkdown
            bioc::maftools
            bioc::GenomicRanges
            bioc::IRanges
            bioc::Biostrings
            bioc::rtracklayer
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          error-on: '"warning"'
