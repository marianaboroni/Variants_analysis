# Central registry of functional predictors. Detection is alias-based; a
# predictor is only used when APPLICABLE to a variant's consequence. Predictors
# NEVER set filter_status on their own (use_for_filtering: false). All thresholds
# are HEURISTIC until calibrated (see docs/PREDICTOR_RULES.md).

SIFT:
  aliases: [SIFT, SIFT_score, SIFT_pred, SIFT4G_score]
  variant_scope: [missense]
  family: protein_function
  direction: lower_is_more_damaging
  score_min: 0
  score_max: 1
  damaging_threshold: 0.05
  pred_damaging_labels: [deleterious, damaging, deleterious_low_confidence]
  use_for_prioritization: true
  use_for_filtering: false

